{% extends 'base.html' %}{% block body %}<section class="card"><h1>Scout Dilemma</h1><p>Create a game. Enter one full name per line. The game requires an even number of participants.</p>{% if error %}<p class="error">{{error}}</p>{% endif %}<form method="post"><label>Participants</label><textarea name="participants" rows="12" required placeholder="Alex Smith&#10;Jamie Jones">{{participants or ''}}</textarea><label>Rounds</label><input type="number" name="rounds" value="{{rounds or 5}}" min="1" max="50"><button>Create game</button></form></section>{% endblock %}
